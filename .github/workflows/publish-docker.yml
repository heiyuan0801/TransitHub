name: Publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag for a manual build
        required: true
        default: manual

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/heiyuan0801/transithub
  DOCKERHUB_IMAGE: 192586992/transithub

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Hub credentials
        shell: bash
        env:
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
        run: |
          if [[ -z "${DOCKER_PAT}" ]]; then
            echo "::error::Repository secret DOCKER_PAT is not configured"
            exit 1
          fi

      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: 192586992
          password: ${{ secrets.DOCKER_PAT }}

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Build Cloud
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: 192586992/thi

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name != 'workflow_dispatch' }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
